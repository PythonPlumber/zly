<td style="font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--zly-muted);">{{ session.jti[:12] }}...</td>
<td style="font-family: 'Space Mono', monospace; font-size: 0.7rem;">{{ session.created_at or 'N/A' }}</td>
<td>
    {% if session.is_current %}
    <span class="zly-badge zly-badge-active">Current</span>
    {% else %}
    <span class="zly-badge zly-badge-hidden">{{ session.expires_at or 'N/A' }}</span>
    {% endif %}
</td>
<td style="text-align: right;">
    {% if not session.is_current %}
    <button class="zly-btn zly-btn-danger" style="font-size: 0.55rem; padding: 0.25rem 0.5rem;"
            hx-delete="/api/v1/sessions/{{ session.jti }}" hx-target="closest tr" hx-swap="outerHTML"
            hx-confirm="Revoke this session?">Revoke</button>
    {% endif %}
</td>

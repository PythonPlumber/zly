{% extends "base.html" %}

{% block title %}Dashboard — UrlForge{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <h2 class="text-2xl font-bold mb-6">Dashboard</h2>

{% if default_ws %}
    <div hx-get="/api/v1/workspaces/{{ default_ws.id }}/analytics/summary" hx-trigger="load" class="space-y-6">
        <div class="flex justify-center py-12">
            <div class="animate-spin h-8 w-8 border-4 border-blue-500 border-t-transparent rounded-full"></div>
        </div>
    </div>
{% else %}
    <p class="text-gray-400">No workspace found. Create one to get started.</p>
{% endif %}
</div>
{% endblock %}

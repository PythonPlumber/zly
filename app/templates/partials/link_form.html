<div class="zly-modal-overlay" onclick="if(event.target===this)this.remove()">
    <div class="zly-modal" style="width: 32rem;">
        <h3 style="font-size: 0.75rem; letter-spacing: 0.15em; margin-bottom: 1.25rem; color: var(--zly-muted);">
            {% if link %}{{ 'EDIT LINK' }}{% else %}{{ 'NEW LINK' }}{% endif %}
        </h3>
        <form hx-{% if link %}patch="/api/v1/workspaces/{{ workspace_id }}/links/{{ link.id }}"{% else %}post="/api/v1/workspaces/{{ workspace_id }}/links"{% endif %}
              hx-target="body" hx-swap="outerHTML"
              hx-on::after-request="if(event.detail.successful){document.querySelector('.zly-modal-overlay').remove()}">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label>Destination URL</label>
                    <input type="url" name="destination_url" value="{{ link.destination_url if link else '' }}" class="zly-input" placeholder="https://example.com" required>
                </div>
                <div>
                    <label>Title (optional)</label>
                    <input type="text" name="title" value="{{ link.title if link else '' }}" class="zly-input" placeholder="Link title">
                </div>
                <div>
                    <label>Custom Short Code (optional)</label>
                    <input type="text" name="short_code" value="{{ link.short_code if link else '' }}" class="zly-input" placeholder="my-custom-slug" {% if link %}disabled{% endif %}>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label>Password (optional)</label>
                        <input type="text" name="password" class="zly-input" placeholder="Leave blank for none">
                    </div>
                    <div>
                        <label>Activate At (optional)</label>
                        <input type="datetime-local" name="activate_at" value="{{ link.activate_at.strftime('%Y-%m-%dT%H:%M') if link and link.activate_at else '' }}" class="zly-input">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label>Expires At (optional)</label>
                        <input type="datetime-local" name="expires_at" value="{{ link.expires_at.strftime('%Y-%m-%dT%H:%M') if link and link.expires_at else '' }}" class="zly-input">
                    </div>
                    <div>
                        <label>Max Clicks (optional)</label>
                        <input type="number" name="max_clicks" value="{{ link.max_clicks if link and link.max_clicks else '' }}" class="zly-input" placeholder="Unlimited" min="1">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label>Folder (optional)</label>
                        <select name="folder_id" class="zly-input">
                            <option value="">No folder</option>
                            {% for f in folders or [] %}
                            <option value="{{ f.id }}" {% if link and link.folder_id == f.id %}selected{% endif %}>{{ f.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 1.25rem; padding-top: 1.25rem;">
                        <label style="display:flex;align-items:center;gap:0.4rem;margin:0;cursor:pointer;">
                            <input type="checkbox" name="is_active" value="false" {% if not link or link.is_active %}checked{% endif %} style="accent-color: var(--zly-emerald); width: 1rem; height: 1rem;" onchange="this.value=this.checked ? 'true' : 'false'">
                            Active
                        </label>
                        <label style="display:flex;align-items:center;gap:0.4rem;margin:0;cursor:pointer;">
                            <input type="checkbox" name="is_archived" value="false" {% if link and link.is_archived %}checked{% endif %} style="accent-color: var(--zly-emerald); width: 1rem; height: 1rem;" onchange="this.value=this.checked ? 'true' : 'false'">
                            Archived
                        </label>
                    </div>
                </div>
                <p style="font-size: 0.6rem; color: var(--zly-muted); font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.03em;">Archived links return 410. Max clicks auto-disables after limit.</p>
                <div>
                    <label>Notes (internal, optional)</label>
                    <textarea name="notes" class="zly-input" rows="2" placeholder="Internal notes — not visible to visitors" style="resize:vertical; font-size:0.75rem;">{{ link.notes if link and link.notes else '' }}</textarea>
                </div>
                <details id="utm-details" style="border:1px solid var(--zly-line);border-radius:0.25rem;">
                    <summary style="padding:0.5rem;font-size:0.6rem;letter-spacing:0.1em;cursor:pointer;color:var(--zly-muted);">UTM Parameters — Live Preview</summary>
                    <div style="padding:0.75rem;display:flex;flex-direction:column;gap:0.75rem;">
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
                            <div><label class="zly-label" style="font-size:0.55rem;">Source</label><input type="text" name="utm_source" class="zly-input utm-field" style="width:100%;margin-top:0.2rem;font-size:0.65rem;" placeholder="newsletter"></div>
                            <div><label class="zly-label" style="font-size:0.55rem;">Medium</label><input type="text" name="utm_medium" class="zly-input utm-field" style="width:100%;margin-top:0.2rem;font-size:0.65rem;" placeholder="email"></div>
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
                            <div><label class="zly-label" style="font-size:0.55rem;">Campaign</label><input type="text" name="utm_campaign" class="zly-input utm-field" style="width:100%;margin-top:0.2rem;font-size:0.65rem;" placeholder="spring_sale"></div>
                            <div><label class="zly-label" style="font-size:0.55rem;">Content</label><input type="text" name="utm_content" class="zly-input utm-field" style="width:100%;margin-top:0.2rem;font-size:0.65rem;" placeholder="hero_banner"></div>
                        </div>
                        <div><label class="zly-label" style="font-size:0.55rem;">Term</label><input type="text" name="utm_term" class="zly-input utm-field" style="width:100%;margin-top:0.2rem;font-size:0.65rem;" placeholder="running+shoes"></div>
                        <div style="background:rgba(0,0,0,0.3);border:1px solid var(--zly-line);padding:0.5rem;word-break:break-all;">
                            <p style="font-size:0.55rem;letter-spacing:0.08em;color:var(--zly-muted);margin-bottom:0.25rem;">PREVIEW URL</p>
                            <code id="utm-preview" style="font-size:0.65rem;color:var(--zly-emerald);font-family:'Space Mono',monospace;">—</code>
                        </div>
                    </div>
                </details>
                <script>
                (function(){
                    var dest = document.querySelector('input[name="destination_url"]');
                    var preview = document.getElementById('utm-preview');
                    function updateUTM(){
                        if(!dest||!preview) return;
                        try {
                            var url = new URL(dest.value || 'https://example.com');
                            document.querySelectorAll('.utm-field').forEach(function(el){
                                if(el.value) url.searchParams.set(el.name, el.value);
                                else url.searchParams.delete(el.name);
                            });
                            preview.textContent = url.toString();
                        } catch(e){ preview.textContent = dest.value || 'Enter destination URL'; }
                    }
                    if(dest) dest.addEventListener('input', updateUTM);
                    document.querySelectorAll('.utm-field').forEach(function(el){ el.addEventListener('input', updateUTM); });
                    setTimeout(updateUTM, 100);
                })();
                </script>
                <div style="display: flex; gap: 0.75rem; justify-content: flex-end; padding-top: 0.5rem; border-top: 1px solid var(--zly-line);">
                    <button type="button" class="zly-btn zly-btn-secondary" onclick="this.closest('.zly-modal-overlay').remove()">Cancel</button>
                    <button type="submit" class="zly-btn zly-btn-primary">{% if link %}Save Changes{% else %}Create Link{% endif %}</button>
                </div>
            </div>
        </form>
    </div>
</div>

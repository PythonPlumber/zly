<div class="zly-modal-overlay" onclick="if(event.target===this)this.remove()">
    <div class="zly-modal" style="width: 32rem;">
        <h3 style="font-size: 0.75rem; letter-spacing: 0.15em; margin-bottom: 1.25rem; color: var(--zly-muted);">
            {% if webhook %}{{ 'EDIT WEBHOOK' }}{% else %}{{ 'NEW WEBHOOK' }}{% endif %}
        </h3>
        <form hx-{% if webhook %}patch="/api/v1/workspaces/{{ workspace_id }}/webhooks/{{ webhook.id }}"{% else %}post="/api/v1/workspaces/{{ workspace_id }}/webhooks"{% endif %}
              hx-target="body" hx-swap="outerHTML"
              hx-on::after-request="if(event.detail.successful){document.querySelector('.zly-modal-overlay').remove()}">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label>Name</label>
                    <input type="text" name="name" value="{{ webhook.name if webhook else '' }}" class="zly-input" placeholder="My Webhook" required>
                </div>
                <div>
                    <label>URL</label>
                    <input type="url" name="url" value="{{ webhook.url if webhook else '' }}" class="zly-input" placeholder="https://example.com/hook" required>
                </div>
                <div>
                    <label>Events (comma-separated, leave empty for all)</label>
                    <input type="text" name="events" value="{{ webhook.events|join(', ') if webhook and webhook.events else '' }}" class="zly-input" placeholder="link.created, link.clicked">
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label style="margin: 0; cursor: pointer;">Active</label>
                    <input type="checkbox" name="is_active" value="false" {% if not webhook or webhook.is_active %}checked{% endif %} style="accent-color: var(--zly-emerald); width: 1rem; height: 1rem;"
                           onchange="this.value=this.checked ? 'true' : 'false'">
                </div>
                <div style="display: flex; gap: 0.75rem; justify-content: flex-end; padding-top: 0.5rem; border-top: 1px solid var(--zly-line);">
                    <button type="button" class="zly-btn zly-btn-secondary" onclick="this.closest('.zly-modal-overlay').remove()">Cancel</button>
                    <button type="submit" class="zly-btn zly-btn-primary">{% if webhook %}Save{% else %}Create{% endif %}</button>
                </div>
            </div>
        </form>
    </div>
</div>

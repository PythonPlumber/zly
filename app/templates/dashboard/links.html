{% extends "base.html" %}

{% block title %}Links — UrlForge{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold">Links</h2>
    </div>

    <div class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-800 text-gray-400 text-sm uppercase">
                <tr>
                    <th class="text-left px-4 py-3 font-medium">Short URL</th>
                    <th class="text-left px-4 py-3 font-medium">Destination</th>
                    <th class="text-left px-4 py-3 font-medium">Clicks</th>
                    <th class="text-left px-4 py-3 font-medium">Status</th>
                    <th class="text-left px-4 py-3 font-medium">Created</th>
                    <th class="text-right px-4 py-3 font-medium">Actions</th>
                </tr>
            </thead>
            <tbody id="links-tbody" class="divide-y divide-gray-800">
                <tr>
                    <td colspan="6" class="px-4 py-12 text-center text-gray-500">
                        Select a workspace to view links.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

<div class="zly-modal-overlay" onclick="if(event.target===this)this.remove()">
    <div class="zly-modal" style="width: 32rem;">
        <h3 style="font-size: 0.75rem; letter-spacing: 0.15em; margin-bottom: 1.25rem; color: var(--zly-muted);">
            {% if key %}{{ 'EDIT API KEY' }}{% else %}{{ 'NEW API KEY' }}{% endif %}
        </h3>
        <form hx-{% if key %}patch="/api/v1/workspaces/{{ workspace_id }}/api-keys/{{ key.id }}"{% else %}post="/api/v1/workspaces/{{ workspace_id }}/api-keys"{% endif %}
              hx-target="body" hx-swap="outerHTML"
              hx-on::after-request="if(event.detail.successful){document.querySelector('.zly-modal-overlay').remove()}">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label>Name</label>
                    <input type="text" name="name" value="{{ key.name if key else '' }}" class="zly-input" placeholder="My API Key" required>
                </div>
                <div>
                    <label>Permissions (comma-separated, empty = all)</label>
                    <input type="text" name="permissions" value="{{ key.permissions if key and key.permissions else '' }}" class="zly-input" placeholder="links:create, analytics:view">
                    <p style="font-size: 0.6rem; color: var(--zly-muted); margin-top: 0.375rem; font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.03em;">
                        Leave empty to grant full access.
                    </p>
                </div>
                {% if key %}
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label style="margin: 0; cursor: pointer;">Active</label>
                    <input type="checkbox" name="is_active" value="false" {% if key.is_active %}checked{% endif %} style="accent-color: var(--zly-emerald); width: 1rem; height: 1rem;"
                           onchange="this.value=this.checked ? 'true' : 'false'">
                </div>
                {% endif %}
                <div style="display: flex; gap: 0.75rem; justify-content: flex-end; padding-top: 0.5rem; border-top: 1px solid var(--zly-line);">
                    <button type="button" class="zly-btn zly-btn-secondary" onclick="this.closest('.zly-modal-overlay').remove()">Cancel</button>
                    <button type="submit" class="zly-btn zly-btn-primary">{% if key %}Save{% else %}Create{% endif %}</button>
                </div>
            </div>
        </form>
    </div>
</div>

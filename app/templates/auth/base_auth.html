<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zly{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,300;0,400;1,300&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        logo: ['Cinzel', 'serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                        body: ['Lora', 'serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    colors: {
                        zlyDark: '#050a07',
                        zlyCream: '#f4f0ea',
                        zlyMuted: '#9a968f',
                        zlyLine: 'rgba(244, 240, 234, 0.08)',
                        zlyEmerald: '#22c55e',
                        zlyEmeraldDark: '#16a34a',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/main.css">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="auth-shell">
        {% block content %}{% endblock %}
    </div>
    <div id="zly-toast" style="position: fixed; top: 1rem; right: 1rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem;"></div>
    <script src="/static/js/app.js"></script>
</body>
</html>

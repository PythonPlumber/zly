services:
  - type: web
    name: zly
    env: python
    buildCommand: pip install -e ".[dev]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://zly.onrender.com
      - key: DEFAULT_DOMAIN
        value: zly.onrender.com
      - key: ENVIRONMENT
        value: production

{% extends "auth/base_auth.html" %}
{% block title %}Set New Password — Zly{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="zly-logo">ZLY<em>ENTERPRISE</em></div>
    <h1>Set new password</h1>
    <p class="subtitle">Choose a strong password for your account</p>
    <form hx-post="/api/v1/auth/reset-password" hx-target="#error-msg" hx-swap="innerHTML"
          hx-vals='js:{token: "{{ token }}", new_password: document.getElementById("password").value}'
          hx-on::after-request="if(event.detail.successful){window.location.href='/login?reset=1'}">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="field">
            <label for="password">New password</label>
            <input id="password" type="password" name="new_password" class="zly-input" placeholder="Min. 8 characters" required minlength="8">
        </div>
        <button type="submit" class="zly-btn zly-btn-primary">Reset password</button>
        <div id="error-msg" class="error-msg"></div>
    </form>
    <p class="auth-link"><a href="/login">&larr; Back to login</a></p>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zly{% endblock %}</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --zly-red: #ef4444;
            --zly-red-dark: #dc2626;
            --zly-bg: #000000;
            --zly-card: #1a1a1a;
            --zly-card-border: #2a2a2a;
            --zly-text: #ffffff;
            --zly-muted: #888888;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--zly-bg);
            color: var(--zly-text);
            min-height: 100vh;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Fredoka', 'Inter', sans-serif;
            font-weight: 600;
        }
        .zly-logo {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--zly-red);
        }
        .zly-logo-small {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            color: var(--zly-red);
        }
        .sidebar {
            background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
            border-right: 2px solid var(--zly-card-border);
            width: 240px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 50;
        }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.625rem 1rem;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--zly-muted);
            transition: all 0.2s ease;
            text-decoration: none;
            position: relative;
        }
        .sidebar-link:hover {
            color: var(--zly-text);
            background: rgba(239, 68, 68, 0.08);
            transform: translateX(4px);
        }
        .sidebar-link.active {
            color: white;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .sidebar-link svg {
            width: 1.25rem;
            height: 1.25rem;
            flex-shrink: 0;
        }
        .main-content {
            margin-left: 240px;
            padding: 2rem;
            min-height: 100vh;
        }
        .zly-card {
            background: var(--zly-card);
            border: 1px solid var(--zly-card-border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.2s ease;
        }
        .zly-card:hover {
            border-color: rgba(239, 68, 68, 0.2);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.05);
        }
        .zly-btn {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            padding: 0.5rem 1.25rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .zly-btn-primary {
            background: var(--zly-red);
            color: white;
        }
        .zly-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        .zly-btn-secondary {
            background: var(--zly-card);
            border: 1px solid var(--zly-card-border);
            color: var(--zly-text);
        }
        .zly-btn-secondary:hover {
            border-color: var(--zly-red);
            transform: translateY(-2px);
        }
        .zly-input {
            background: var(--zly-bg);
            border: 1px solid var(--zly-card-border);
            border-radius: 10px;
            padding: 0.625rem 0.875rem;
            color: var(--zly-text);
            font-size: 0.875rem;
            width: 100%;
            transition: all 0.2s ease;
            outline: none;
        }
        .zly-input:focus {
            border-color: var(--zly-red);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }
        .zly-input::placeholder { color: var(--zly-muted); }
        label { font-family: 'Fredoka', sans-serif; font-size: 0.8rem; color: var(--zly-muted); display: block; margin-bottom: 0.375rem; }
        .zly-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.625rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .zly-badge-active { background: rgba(77, 255, 181, 0.15); color: var(--zly-green); }
        .zly-badge-hidden { background: rgba(154, 138, 191, 0.15); color: var(--zly-muted); }
        .zly-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .zly-table th {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--zly-muted);
            padding: 0.75rem 1rem;
            text-align: left;
            background: rgba(0, 0, 0, 0.5);
        }
        .zly-table td {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--zly-card-border);
            font-size: 0.875rem;
        }
        .zly-table tr:hover td {
            background: rgba(239, 68, 68, 0.03);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--zly-bg); }
        ::-webkit-scrollbar-thumb { background: var(--zly-card-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a2f5a; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        .zly-spinner {
            width: 2rem;
            height: 2rem;
            border: 3px solid var(--zly-card-border);
            border-top: 3px solid var(--zly-red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <aside class="sidebar">
        <div style="padding: 1.5rem 1rem; border-bottom: 1px solid var(--zly-card-border);">
            <a href="/dashboard" class="zly-logo" style="text-decoration: none;">✦ Zly</a>
        </div>
        <nav style="flex: 1; padding: 1rem 0.75rem; display: flex; flex-direction: column; gap: 0.25rem;">
            <a href="/dashboard" class="sidebar-link {% if request.url.path == '/dashboard' %}active{% endif %}">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Dashboard
            </a>
            <a href="/dashboard/links" class="sidebar-link {% if '/dashboard/links' in request.url.path %}active{% endif %}">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                Links
            </a>
            <a href="/dashboard/bio" class="sidebar-link {% if '/dashboard/bio' in request.url.path %}active{% endif %}">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                Bio Page
            </a>
            <a href="/dashboard/domains" class="sidebar-link {% if '/dashboard/domains' in request.url.path %}active{% endif %}">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
                Domains
            </a>
            <a href="/dashboard/api-keys" class="sidebar-link {% if '/dashboard/api-keys' in request.url.path %}active{% endif %}">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                API Keys
            </a>
            <a href="/dashboard/webhooks" class="sidebar-link {% if '/dashboard/webhooks' in request.url.path %}active{% endif %}">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                Webhooks
            </a>
            <a href="/dashboard/tags" class="sidebar-link {% if '/dashboard/tags' in request.url.path %}active{% endif %}">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
                Tags
            </a>
            <a href="/dashboard/settings" class="sidebar-link {% if '/dashboard/settings' in request.url.path %}active{% endif %}">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Settings
            </a>
        </nav>
        <div style="border-top: 1px solid var(--zly-card-border); padding: 1rem 0.75rem;">
            <div style="display: flex; align-items: center; gap: 0.625rem;">
                <div style="width: 2rem; height: 2rem; border-radius: 8px; background: var(--zly-red); display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 0.75rem; color: white; flex-shrink: 0;">
                    {{ user.email[:2].upper() }}
                </div>
                <div style="overflow: hidden;">
                    <p style="font-size: 0.8rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ user.email }}</p>
                </div>
            </div>
        </div>
    </aside>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
<script>
    document.body.addEventListener('htmx:configRequest', (e) => {
        const match = document.cookie.match(/(?:^|;\s*)zly_csrf_token=([^;]*)/);
        if (match) {
            e.detail.headers['X-CSRF-Token'] = match[1];
        }
    });
</script>
</body>
</html>

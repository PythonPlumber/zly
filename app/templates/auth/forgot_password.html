{% extends "auth/base_auth.html" %}
{% block title %}Forgot Password — Zly{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="zly-logo">ZLY<em>ENTERPRISE</em></div>
    <h1>Reset password</h1>
    <p class="subtitle">Enter your email to receive a reset link</p>
    <form hx-post="/api/v1/auth/forgot-password" hx-target="#status-msg" hx-swap="innerHTML"
          hx-vals='js:{email: document.getElementById("email").value}'
          hx-on::after-request="if(event.detail.successful){document.getElementById('email-field').style.display='none';document.getElementById('submit-btn').style.display='none';}">
        <div class="field" id="email-field">
            <label for="email">Email address</label>
            <input id="email" type="email" class="zly-input" placeholder="you@example.com" required>
        </div>
        <button id="submit-btn" type="submit" class="zly-btn zly-btn-primary">Send reset link</button>
        <div id="status-msg" style="color: var(--zly-emerald); font-size: 0.8rem; text-align: center; margin-top: 1rem; font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.05em;"></div>
    </form>
    <p class="auth-link"><a href="/login">&larr; Back to login</a></p>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en" data-theme="{{ bio.theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ bio.title }} — UrlForge</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        {% if bio.theme == "light" %}
        .bio-card { background: white; color: #111; }
        .bio-link { background: #f3f4f6; color: #111; }
        .bio-link:hover { background: #e5e7eb; }
        {% elif bio.theme == "midnight" %}
        .bio-card { background: #0f172a; color: #f1f5f9; }
        .bio-link { background: #1e293b; color: #e2e8f0; }
        .bio-link:hover { background: #334155; }
        {% else %}
        /* default dark */
        .bio-card { background: #111; color: #f1f5f9; }
        .bio-link { background: #1f2937; color: #e2e8f0; }
        .bio-link:hover { background: #374151; }
        {% endif %}
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background: {% if bio.theme == 'light' %}#f9fafb{% else %}#030712{% endif %};">
    <div class="bio-card rounded-2xl shadow-xl w-full max-w-md p-8 text-center">
        {% if bio.avatar_url %}
        <img src="{{ bio.avatar_url }}" alt="" class="w-24 h-24 rounded-full mx-auto mb-4 object-cover">
        {% endif %}
        <h1 class="text-2xl font-bold mb-2">{{ bio.title }}</h1>
        {% if bio.bio %}
        <p class="opacity-75 mb-6">{{ bio.bio }}</p>
        {% endif %}
        <div class="space-y-3">
            {% for link in bio.links if link.is_active %}
            <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer"
               class="bio-link block rounded-xl px-4 py-3 font-medium transition text-center">
                {{ link.title }}
            </a>
            {% endfor %}
        </div>
        <p class="text-xs opacity-40 mt-8">Powered by UrlForge</p>
    </div>
</body>
</html>

<div class="zly-modal-overlay" id="contact-form-modal" style="position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: rgba(5,10,7,0.85); backdrop-filter: blur(2px);">
    <div class="zly-card" style="max-width: 420px; width: 90%; padding: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="font-size: 0.8rem; letter-spacing: 0.08em;">{% if contact %}Edit Contact{% else %}Add Contact{% endif %}</h3>
            <button onclick="this.closest('.zly-modal-overlay').remove()" style="background: none; border: none; color: var(--zly-muted); font-size: 1.1rem; cursor: pointer;">&times;</button>
        </div>
        <form hx-post="/api/v1/workspaces/{{ workspace_id }}/email/contacts" hx-target="#contacts-tbody" hx-swap="innerHTML" hx-on::after-request="if(event.detail.successful){document.getElementById('email-form-modal').innerHTML='';}">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label class="zly-label">Email</label>
                    <input type="email" name="email" class="zly-input" required
                           hx-get="/dashboard/email/contacts/list" hx-trigger="load" style="display:none;">
                    <input type="email" name="email" class="zly-input" required
                           style="width: 100%; margin-top: 0.3rem;"
                           value="{{ contact.email if contact else '' }}" placeholder="user@example.com">
                </div>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.25rem;">
                <button type="button" class="zly-btn zly-btn-secondary" style="font-size: 0.6rem; padding: 0.35rem 0.75rem;" onclick="this.closest('.zly-modal-overlay').remove()">Cancel</button>
                <button type="submit" class="zly-btn zly-btn-primary" style="font-size: 0.6rem; padding: 0.35rem 0.75rem;">Save</button>
            </div>
        </form>
    </div>
</div>

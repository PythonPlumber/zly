<div class="zly-modal-overlay" onclick="if(event.target===this)this.remove()">
    <div class="zly-modal" style="width: 28rem;">
        <h3 style="font-size: 0.75rem; letter-spacing: 0.15em; margin-bottom: 1.25rem; color: var(--zly-muted);">ADD CUSTOM DOMAIN</h3>
        <form hx-post="/api/v1/workspaces/{{ workspace_id }}/domains" hx-target="body" hx-swap="outerHTML"
              hx-on::after-request="if(event.detail.successful){document.querySelector('.zly-modal-overlay').remove()}">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label>Domain</label>
                    <input type="text" name="domain" class="zly-input" placeholder="links.yourdomain.com" required>
                    <p style="font-size: 0.6rem; color: var(--zly-muted); margin-top: 0.375rem; font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.03em;">
                        Add a CNAME record pointing to your Zly instance.
                    </p>
                </div>
                <div style="display: flex; gap: 0.75rem; justify-content: flex-end; padding-top: 0.5rem; border-top: 1px solid var(--zly-line);">
                    <button type="button" class="zly-btn zly-btn-secondary" onclick="this.closest('.zly-modal-overlay').remove()">Cancel</button>
                    <button type="submit" class="zly-btn zly-btn-primary">Add Domain</button>
                </div>
            </div>
        </form>
    </div>
</div>

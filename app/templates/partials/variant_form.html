<div class="zly-modal-overlay" onclick="if(event.target===this)this.remove()">
    <div class="zly-modal" style="width: 28rem;">
        <h3 style="font-size: 0.75rem; letter-spacing: 0.15em; margin-bottom: 1.25rem; color: var(--zly-muted);">
            {% if variant %}{{ 'EDIT VARIANT' }}{% else %}{{ 'NEW VARIANT' }}{% endif %}
        </h3>
        <form hx-{% if variant %}put="/api/v1/links/{{ link_id }}/variants/{{ variant.id }}"{% else %}post="/api/v1/links/{{ link_id }}/variants"{% endif %}
              hx-target="body" hx-swap="outerHTML"
              hx-on::after-request="if(event.detail.successful){document.querySelector('.zly-modal-overlay').remove()}">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label>Destination URL</label>
                    <input type="url" name="destination_url" value="{{ variant.destination_url if variant else '' }}" class="zly-input" placeholder="https://example.com/variant-a" required>
                </div>
                <div>
                    <label>Weight (%)</label>
                    <input type="number" name="weight" value="{{ variant.weight if variant else '50' }}" class="zly-input" min="1" max="100" required>
                    <p style="font-size: 0.6rem; color: var(--zly-muted); margin-top: 0.375rem; font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.03em;">Percentage of traffic to route to this variant.</p>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label style="margin: 0; cursor: pointer;">Default</label>
                    <input type="checkbox" name="is_default" value="true" {% if variant and variant.is_default %}checked{% endif %} style="accent-color: var(--zly-emerald); width: 1rem; height: 1rem;">
                </div>
                <div style="display: flex; gap: 0.75rem; justify-content: flex-end; padding-top: 0.5rem; border-top: 1px solid var(--zly-line);">
                    <button type="button" class="zly-btn zly-btn-secondary" onclick="this.closest('.zly-modal-overlay').remove()">Cancel</button>
                    <button type="submit" class="zly-btn zly-btn-primary">{% if variant %}Save{% else %}Add Variant{% endif %}</button>
                </div>
            </div>
        </form>
    </div>
</div>

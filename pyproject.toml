[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "worker*"]

[project]
name = "zly"
version = "1.0.0-dev"
description = "Next-gen open-source URL shortener and marketing platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "PythonPlumber", email = "pythonplumber@senuka.me" },
]
keywords = ["url-shortener", "fastapi", "analytics", "qr-code", "link-in-bio", "marketing", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "qrcode[pil]>=8.0",
    "email-validator>=2.0.0",
    "sentry-sdk>=2.0.0",
    "aiosmtplib>=3.1.0",
]

[project.scripts]
zly-cli = "app.cli:main"

[project.urls]
Homepage = "https://senuka.me"
Repository = "https://github.com/pythonplumber/zly"
Issues = "https://github.com/pythonplumber/zly/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
geo = [
    "geoip2>=5.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

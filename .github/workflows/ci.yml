name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check . 2>&1 | tee logs-ruff.txt

      - name: Type check with mypy
        run: mypy app/ --ignore-missing-imports 2>&1 | tee logs-mypy.txt

      - name: Test with pytest
        run: pytest -v 2>&1 | tee logs-pytest.txt

      - name: Upload logs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            logs-ruff.txt
            logs-mypy.txt
            logs-pytest.txt
          if-no-files-found: warn

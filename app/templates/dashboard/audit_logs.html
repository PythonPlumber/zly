{% extends "base.html" %}
{% block title %}Audit Logs — Zly{% endblock %}
{% block content %}
<div style="max-width: 72rem; margin: 0 auto;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.25rem; letter-spacing: 0.1em;">Audit Logs</h1>
        <div style="display: flex; gap: 0.5rem;">
            <span class="zly-badge zly-badge-active">● ADMIN</span>
        </div>
    </div>

    <div class="zly-card" style="padding: 0; overflow: hidden;">
        <table class="zly-table">
            <thead>
                <tr>
                    <th>Action</th>
                    <th>Resource</th>
                    <th>Resource ID</th>
                    <th>User</th>
                    <th>IP</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="audit-tbody" hx-get="/dashboard/admin/audit-logs/list" hx-trigger="load" hx-swap="innerHTML">
                <tr>
                    <td colspan="6" style="text-align: center; padding: 3rem 1rem; color: var(--zly-muted); font-family: 'Space Grotesk', sans-serif; font-size: 0.7rem; letter-spacing: 0.05em;">
                        Loading audit logs...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

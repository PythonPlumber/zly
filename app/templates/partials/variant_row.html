<tr>
    <td style="max-width: 16rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Space Mono', monospace; font-size: 0.7rem;">{{ variant.destination_url }}</td>
    <td style="font-family: 'Space Mono', monospace; font-size: 0.7rem;">{{ variant.weight }}%</td>
    <td>
        {% if variant.is_default %}
        <span class="zly-badge zly-badge-active">Default</span>
        {% else %}
        <span class="zly-badge zly-badge-hidden">Variant</span>
        {% endif %}
    </td>
    <td style="text-align: right; white-space: nowrap;">
        <button class="zly-btn zly-btn-secondary" style="font-size: 0.55rem; padding: 0.25rem 0.6rem; display: inline-flex;"
                hx-get="/dashboard/links/{{ link_id }}/variants/{{ variant.id }}/edit-form" hx-target="#variant-form-modal" hx-swap="innerHTML">Edit</button>
        <button class="zly-btn zly-btn-danger" style="font-size: 0.55rem; padding: 0.25rem 0.6rem; display: inline-flex;"
                hx-delete="/api/v1/links/{{ link_id }}/variants/{{ variant.id }}" hx-target="closest tr" hx-swap="outerHTML"
                hx-confirm="Delete this variant?">Delete</button>
    </td>
</tr>

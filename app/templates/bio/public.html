<!DOCTYPE html>
<html lang="en" data-theme="{{ bio.theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ bio.title }} — Zly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,300;0,400;1,300&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        logo: ['Cinzel', 'serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                        body: ['Lora', 'serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    colors: {
                        zlyDark: '#050a07',
                        zlyCream: '#f4f0ea',
                        zlyMuted: '#9a968f',
                        zlyLine: 'rgba(244, 240, 234, 0.08)',
                        zlyEmerald: '#22c55e',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Lora', serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; }
        {% if bio.theme == "light" %}
        body { background: #f4f0ea; }
        .bio-card { background: white; color: #050a07; }
        .bio-link { background: #f4f0ea; color: #050a07; border: 1px solid rgba(5,10,7,0.1); }
        .bio-link:hover { border-color: #22c55e; }
        {% elif bio.theme == "midnight" %}
        body { background: radial-gradient(circle at center, #0a1610 0%, #030604 100%); }
        .bio-card { background: rgba(10, 22, 16, 0.9); color: #f4f0ea; border: 1px solid rgba(244,240,234,0.08); }
        .bio-link { background: rgba(10, 22, 16, 0.6); color: #f4f0ea; border: 1px solid rgba(244,240,234,0.08); }
        .bio-link:hover { border-color: #22c55e; background: rgba(34,197,94,0.06); }
        {% else %}
        body { background: #050a07; }
        .bio-card { background: rgba(5,10,7,0.95); color: #f4f0ea; border: 1px solid rgba(244,240,234,0.08); }
        .bio-link { background: rgba(10, 22, 16, 0.5); color: #f4f0ea; border: 1px solid rgba(244,240,234,0.08); }
        .bio-link:hover { border-color: #22c55e; }
        {% endif %}
        .zly-brand { font-family: 'Cinzel', serif; font-weight: 700; }
    </style>
</head>
<body>
    <div class="bio-card" style="width: 100%; max-width: 26rem; padding: 2.5rem 2rem; text-align: center;">
        {% if bio.avatar_url %}
        <img src="{{ bio.avatar_url }}" alt="" style="width: 6rem; height: 6rem; margin: 0 auto 1rem; object-fit: cover; border: 2px solid #22c55e;">
        {% endif %}
        <h1 style="font-size: 1.5rem; letter-spacing: 0.05em; margin: 0 0 0.5rem; text-transform: uppercase;">{{ bio.title }}</h1>
        {% if bio.bio %}
        <p style="opacity: 0.65; margin: 0 0 1.5rem; line-height: 1.5; font-size: 0.9rem;">{{ bio.bio }}</p>
        {% endif %}
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            {% for link in bio.links if link.is_active %}
            <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer"
               class="bio-link"
               style="display: block; padding: 0.875rem 1.25rem; font-weight: 600; text-decoration: none; transition: all 0.15s ease; font-family: 'Space Grotesk', sans-serif; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase;">
                {{ link.title }}
            </a>
            {% endfor %}
        </div>
        <p style="font-size: 0.6rem; opacity: 0.3; margin-top: 2rem; letter-spacing: 0.15em;">
            POWERED BY <span class="zly-brand">ZLY</span>
        </p>
    </div>
</body>
</html>

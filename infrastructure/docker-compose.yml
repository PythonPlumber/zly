services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urlforge
      POSTGRES_PASSWORD: urlforge
      POSTGRES_DB: urlforge
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  fastapi:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file: .env

volumes:
  pg_data:
  redis_data:

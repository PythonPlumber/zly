<td style="font-family: 'Space Mono', monospace; font-size: 0.75rem; color: var(--zly-emerald);">{{ domain.domain }}</td>
<td>
    {% if domain.is_verified %}
    <span class="zly-badge zly-badge-active">Verified</span>
    {% else %}
    <span class="zly-badge zly-badge-warning">Pending</span>
    {% endif %}
</td>
<td style="font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--zly-muted);">
    {{ domain.created_at.strftime('%Y-%m-%d') if domain.created_at else '' }}
</td>
<td style="text-align: right; white-space: nowrap;">
    {% if not domain.is_verified %}
    <button class="zly-btn zly-btn-secondary" style="font-size: 0.55rem; padding: 0.25rem 0.6rem; display: inline-flex;"
            hx-post="/api/v1/workspaces/{{ workspace_id }}/domains/{{ domain.id }}/verify"
            hx-target="closest tr" hx-swap="outerHTML">Verify</button>
    {% endif %}
    <button class="zly-btn zly-btn-danger" style="font-size: 0.55rem; padding: 0.25rem 0.6rem; display: inline-flex;"
            hx-delete="/api/v1/workspaces/{{ workspace_id }}/domains/{{ domain.id }}" hx-target="closest tr" hx-swap="outerHTML"
            hx-confirm="Delete this domain?">Delete</button>
</td>
